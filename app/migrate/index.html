<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>AnyClass 本机课表迁移</title>
  <link rel="icon" href="/assets/brand/AnyClass_Favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/AnyClass_Icon.svg">
  <link rel="apple-touch-icon" href="/assets/brand/AnyClass_Icon_256.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/assets/timetable/product-shell.css">
  <style>
    main{max-width:680px;margin:auto;padding:32px 20px 120px}.card{padding:24px;border-radius:24px;background:var(--surface,#fff);box-shadow:0 12px 40px #0001}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}button,.button{border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:700;background:#2563eb;color:#fff}.secondary{background:#e8eef8;color:#15213a}.status{margin:18px 0;padding:14px;border-radius:14px;background:#eef4ff}.ok{color:#087443}.error{color:#b42318}input{max-width:100%}small{display:block;margin-top:18px;line-height:1.6;color:#667085}
  </style>
</head>
<body>
<main>
  <section class="card">
    <p>AnyClass</p>
    <h1 id="title">本机课表迁移</h1>
    <p id="description">正在检查本机数据…</p>
    <div id="summary" class="status">准备中</div>
    <div class="actions" id="sourceActions" hidden>
      <button id="start">迁移到 AnyClass</button>
      <button id="exportJson" class="secondary">导出迁移 JSON</button>
    </div>
    <div class="actions" id="targetActions" hidden>
      <label class="button secondary">选择迁移 JSON<input id="importJson" type="file" accept="application/json,.json" hidden></label>
      <a class="button" href="/">打开 Today</a>
      <a class="button secondary" href="/timetable/">打开课表</a>
    </div>
    <small>迁移只在浏览器的两个域名之间进行，不读取 Cookie、密码或登录令牌，不向服务器上传课表。旧域数据不会被删除。</small>
  </section>
</main>
<script src="/assets/migration/origin-migration.js"></script>
</body>
</html>
