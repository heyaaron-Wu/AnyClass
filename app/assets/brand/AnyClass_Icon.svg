<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="blueMain" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4DA7FF"/>
    <stop offset="1" stop-color="#1679F3"/>
  </linearGradient>
  <linearGradient id="blueTop" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#83C6FF"/>
    <stop offset="1" stop-color="#62AAF6"/>
  </linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#58E8C2"/>
    <stop offset="1" stop-color="#25D1A7"/>
  </linearGradient>
</defs>

<g transform="translate(71,8)">
  <!-- Main lower tile -->
  <rect x="126" y="333" width="650" height="548" rx="165" fill="url(#blueMain)"/>
  <!-- Upper soft tile -->
  <rect x="126" y="128" width="410" height="302" rx="108" fill="url(#blueTop)"/>
  <!-- White flowing divider, key feature from selected concept -->
  <path d="M127 411 C204 345 293 350 380 350 C456 350 511 315 548 257"
        fill="none" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round"/>
  <!-- Mint status dot -->
  <circle cx="665" cy="230" r="78" fill="url(#mint)"/>
  <!-- Check mark -->
  <path d="M270 652 L370 749 L607 506"
        fill="none" stroke="#FFFFFF" stroke-width="86"
        stroke-linecap="round" stroke-linejoin="round"/>
