<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8fbff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1728" media="(prefers-color-scheme: dark)">
  <title>设置 · AnyClass</title>
  <link rel="icon" href="/assets/brand/AnyClass_Favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/AnyClass_Icon.svg">
  <link rel="apple-touch-icon" href="/assets/brand/AnyClass_Icon_256.png">
  <link rel="manifest" href="/site.webmanifest">
  <script src="/assets/timetable/product-shell.js?v=import-nav-cleanup-20260918"></script>
  <link rel="stylesheet" href="/assets/timetable/common.css">
  <link rel="stylesheet" href="/assets/timetable/product-shell.css?v=v011-settings-safety-20260921">
</head>
<body data-shell-page="settings">
<main class="shell settings-shell settings-hub">
  <div class="settings-page-heading"><a class="back-button" href="/" aria-label="返回今天">← 返回</a><div><h1>设置</h1><p class="muted">管理显示偏好、课表配置与本地数据。</p></div></div>
  <section class="settings-hub-section" aria-labelledby="personalization-heading">
    <h2 id="personalization-heading">个性化</h2>
    <div class="settings-link-list"><a class="settings-link-row" href="/settings/personalization/"><span><strong>显示名称</strong><small>当前：<span data-display-name-preview>AnyClass</span></small></span><span class="settings-chevron" aria-hidden="true">›</span></a></div>
  </section>
  <section class="settings-hub-section" aria-labelledby="timetable-settings-heading">
    <h2 id="timetable-settings-heading">课表设置</h2>
    <div class="settings-link-list"><a class="settings-link-row" href="/settings/timetable/"><span><strong>显示范围与节次时间</strong><small>自动、全部或自定义显示范围</small></span><span class="settings-chevron" aria-hidden="true">›</span></a></div>
  </section>
  <section class="settings-hub-section" aria-labelledby="data-heading">
    <h2 id="data-heading">数据与日历</h2>
    <div class="settings-link-list"><a class="settings-link-row" href="/local-status/"><span><strong>本地数据</strong><small>查看此设备保存的课程与诊断信息</small></span><span class="settings-chevron" aria-hidden="true">›</span></a><a class="settings-link-row" href="/export/"><span><strong>导出日历</strong><small>生成可导入日历 App 的 ICS 文件</small></span><span class="settings-chevron" aria-hidden="true">›</span></a></div>
  </section>
  <section class="settings-hub-section" aria-labelledby="compatibility-heading">
    <h2 id="compatibility-heading">兼容性</h2>
    <div class="settings-link-list"><a class="settings-link-row" href="/compatibility/"><span><strong>教务系统支持</strong><small>查看已经验证和暂未支持的系统</small></span><span class="settings-chevron" aria-hidden="true">›</span></a></div>
  </section>
  <section class="settings-hub-section" aria-labelledby="about-heading">
    <h2 id="about-heading">关于</h2>
    <div class="settings-link-list"><a class="settings-link-row" href="/about/"><span><strong>关于 AnyClass</strong><small>产品、隐私与版本信息</small></span><span class="settings-chevron" aria-hidden="true">›</span></a></div>
  </section>
</main>
<script>document.querySelector("[data-display-name-preview]").textContent=AnyClassShell.getDisplayName()||AnyClassShell.getBrandLabel();</script>
</body>
</html>
