<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>导入课表</title>
  <link rel="icon" href="/assets/brand/AnyClass_Favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/AnyClass_Icon.svg">
  <link rel="apple-touch-icon" href="/assets/brand/AnyClass_Icon_256.png">
  <link rel="manifest" href="/site.webmanifest">
  <script src="/assets/timetable/product-shell.js?v=import-nav-cleanup-20260918"></script>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}body{margin:0}main{max-width:880px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:20px;box-shadow:0 8px 30px #1e3a5f12}h1{margin:0 0 12px;font-size:24px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}.metric{padding:12px;background:#f4f7fb;border-radius:10px}.metric b{display:block;font-size:20px}.actions{display:flex;gap:10px;margin:18px 0}button,a.button{border:0;border-radius:9px;padding:10px 16px;font-weight:650;cursor:pointer;text-decoration:none}.primary{background:#2563eb;color:#fff}.secondary{background:#e8eef7;color:#172033}.danger{background:#fff1f2;color:#b42318;border:1px solid #fecdd3}button:disabled{opacity:.5;cursor:not-allowed}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid #e5eaf1}.muted{color:#667085}.ok{color:#067647}.error{color:#b42318}@media(max-width:540px){main{padding:12px}.card{padding:14px}th:nth-child(4),td:nth-child(4){display:none}}
  </style>
  <link rel="stylesheet" href="/assets/timetable/product-shell.css?v=v011-import-flow-20260919">
</head>
<body data-shell-page="import">
<main class="shell">
<section id="import-entry" class="card">
  <h1>导入课程表</h1>
  <h2>请选择方式</h2>
  <p class="muted">课程数据只在当前设备处理和保存。</p>
  <div class="shell-choice-grid">
    <button id="chooseComputer" class="shell-choice import-method-button" type="button" aria-expanded="false" aria-controls="computer-import"><strong>电脑导入</strong><span>从电脑上的个人课表导入。</span></button>
    <a class="shell-choice" href="/import-mobile/"><strong>手机 / iPad 导入</strong><span>通过 Safari 分享菜单导入。</span></a>
    <a class="shell-choice" href="/import-file/"><strong>已有课程文件</strong><span>选择之前生成的课表文件。</span></a>
  </div>
</section>
<section id="computer-import" class="card" hidden>
  <div id="import-instructions" class="import-instructions"><h2>电脑导入</h2>
  <ol class="desktop-import-steps">
    <li>点击“复制书签”。</li>
    <li>在 Chrome 或 Edge 中新建书签。</li>
    <li>将复制内容粘贴到书签网址。</li>
    <li>打开学校教务系统个人课表。</li>
    <li>点击“导入 AnyClass 课表”书签。</li>
  </ol>
  <div class="actions"><button id="copyBookmarklet" class="primary" type="button">复制“导入 AnyClass 课表”书签</button></div>
  <p id="copyBookmarkletStatus" class="muted import-copy-status" role="status" hidden></p>
  </div>
  <p id="message" class="muted import-receiver-message" role="status" hidden></p>
  <div id="preview" class="import-preview" hidden>
    <div class="import-preview-heading"><h2>课表已读取</h2><button id="reselectImport" class="import-reselect" type="button">重新选择导入方式</button></div>
    <div class="summary">
      <div class="metric">学期<b id="semester">—</b></div>
      <div class="metric">课程安排<b id="meetingCount">0</b></div>
      <div class="metric">课程<b id="courseCount">0</b></div>
      <div class="metric">调课记录<b id="adjustedCount">0</b></div>
    </div>
    <div class="actions"><button id="save" class="primary">保存到本机</button><button id="cancel" class="secondary">取消</button></div>
    <div class="import-table-wrap"><table><thead><tr><th>课程名称</th><th>星期 / 节次</th><th>地点</th><th>教师</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</section></main>
<script src="/assets/timetable/school-config.js"></script>
<script src="/assets/adapters/zhengfang-v9.js"></script>
<script src="/assets/adapters/adapter-registry.js"></script>
<script src="/assets/adapters/system-detector.js"></script>
<script src="/assets/timetable/phaseb-engine.js"></script>
<script src="/assets/timetable/storage-v2.js"></script>
<script>
(()=>{"use strict";
const SOURCE_ORIGIN="https://www.gupt.edu.cn",PROTOCOL="timetable-import-v1",BOOKMARKLET_ID="anyclass-import",BOOKMARKLET_VERSION="3.0.0";
const $=id=>document.getElementById(id),message=$("message"),preview=$("preview"),save=$("save"),entry=$("import-entry"),instructions=$("import-instructions"),computer=$("computer-import");let pending=null,reply=null;
const copyText=async text=>{if(navigator.clipboard&&isSecureContext)return navigator.clipboard.writeText(text);const area=document.createElement("textarea");area.value=text;area.setAttribute("readonly","");area.style.position="fixed";area.style.opacity="0";document.body.append(area);area.select();const ok=document.execCommand("copy");area.remove();if(!ok)throw Error("COPY_FAILED")};
const setMessage=(text,kind="muted")=>{message.textContent=text;message.className=`import-receiver-message ${kind}`;message.hidden=!text;if(window.AnyClassShell){if(kind==="error")AnyClassShell.setImportError(text);else{AnyClassShell.setImportError(false);AnyClassShell.setStorageError(false)}}};
const getDataset=(key,factory)=>AnyClassStorageV2.getLegacyDataset(key,factory);
const putDataset=(data,factory)=>AnyClassStorageV2.putLegacyAndMigrate(data,TimetableSchoolConfigs.gupt,factory);
const persistenceFactory=async()=>{if(window.parent===window)return indexedDB;if(typeof document.requestStorageAccess!=="function")throw Error("UNPARTITIONED_INDEXEDDB_UNSUPPORTED");const handle=await document.requestStorageAccess({indexedDB:true});if(!handle?.indexedDB)throw Error("UNPARTITIONED_INDEXEDDB_DENIED");return handle.indexedDB};
const tests=[["1-5周",[1,2,3,4,5]],["11周",[11]],["1-3周,6-7周,10周",[1,2,3,6,7,10]],["1-3周(单)",[1,3]],["1-3周(单),7-8周,16周",[1,3,7,8,16]],["1-6周(双)",[2,4,6]]];
const adapter=AnyClassAdapterRegistry.get("zhengfang-v9"),profile=AnyClassSchoolProfiles.gupt;
const testPass=tests.every(([x,y])=>JSON.stringify(adapter.parseWeeks(x))===JSON.stringify(y));
const valid=m=>m&&typeof m.courseName==="string"&&m.courseName.trim()&&Number.isInteger(m.weekday)&&m.weekday>=1&&m.weekday<=7&&Number.isInteger(m.startPeriod)&&m.startPeriod>0&&Number.isInteger(m.endPeriod)&&m.endPeriod>=m.startPeriod&&Array.isArray(m.weeks)&&m.weeks.length>0&&m.weeks.every((w,i,a)=>Number.isInteger(w)&&w>0&&(!i||w>a[i-1]));
const stableMeetings=meetings=>meetings.map(m=>({courseName:m.courseName,weekday:m.weekday,startPeriod:m.startPeriod,endPeriod:m.endPeriod,weeks:[...m.weeks],teacher:m.teacher,locationRaw:m.locationRaw,isAdjusted:m.isAdjusted})).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)));
const fingerprint=async(semester,meetings)=>{const canonical=JSON.stringify({semester,meetings:stableMeetings(meetings)}),digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(canonical));return[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,"0")).join("")};
const showInitial=clear=>{if(clear)pending=null;entry.hidden=false;computer.hidden=true;instructions.hidden=false;preview.hidden=true;$("chooseComputer").setAttribute("aria-expanded","false");setMessage("")};
const renderPreview=data=>{entry.hidden=true;computer.hidden=false;instructions.hidden=true;$("chooseComputer").setAttribute("aria-expanded","true");$("semester").textContent=`${data.semester.academicYear} 第${data.semester.term}学期`;$('meetingCount').textContent=data.meetings.length;$('courseCount').textContent=new Set(data.meetings.map(m=>m.courseName)).size;$('adjustedCount').textContent=data.meetings.filter(m=>m.isAdjusted).length;const rows=document.createDocumentFragment();for(const m of data.meetings){const tr=document.createElement("tr");for(const value of [m.courseName,`周${m.weekday} / ${m.startPeriod}-${m.endPeriod}节`,m.locationRaw||"—",m.teacher||"—"]){const td=document.createElement("td");td.textContent=value;tr.appendChild(td)}rows.appendChild(tr)}$("rows").replaceChildren(rows);setMessage("");preview.hidden=false};
const friendlyImportError=error=>{const code=error?.code||error?.message||"";if(code==="LOW_CONFIDENCE_SYSTEM"||code==="AMBIGUOUS_SYSTEM"||code==="UNSUPPORTED_SYSTEM")return"没有识别到可导入的个人课表。请确认页面正确后重试。";return"没有收到有效的课表数据。请确认你是在个人课表页面运行书签，然后重试。"};
addEventListener("message",async event=>{if(event.origin!==SOURCE_ORIGIN||event.source!==window.parent||pending)return;const p=event.data;if(!p||p.protocol!==PROTOCOL||p.type!=="HTML_IMPORT"||p.nonce!==nonce||p.source?.system!=="zhengfang-v9"||p.source?.origin!==SOURCE_ORIGIN)return;if(p.client?.id!==BOOKMARKLET_ID||p.client?.version!==BOOKMARKLET_VERSION){event.source.postMessage({protocol:PROTOCOL,type:"ACK",nonce:p.nonce,status:"FAIL",code:"OUTDATED_CAPTURE_CLIENT",meetingCount:0},SOURCE_ORIGIN);setMessage("书签版本已过期，请重新复制 AnyClass 导入书签。","error");return}let status="VALIDATION_FAILED",count=0,stats={};try{if(!testPass)throw Error("WEEK_UNIT_TEST_FAILED");const capture={captureVersion:1,sourceOrigin:p.source.origin,semesterSource:p.semesterSource,tableHtml:p.tableHtml};const detection=AnyClassSystemDetector.detect(adapter.captureSignals(capture));if(detection.outcome!=="MATCH")throw Error(detection.outcome==="LOW_CONFIDENCE"?"LOW_CONFIDENCE_SYSTEM":detection.outcome==="AMBIGUOUS"?"AMBIGUOUS_SYSTEM":"UNSUPPORTED_SYSTEM");const parsed=adapter.parse(capture,profile),meetings=parsed.meetings,validated=meetings.filter(valid).length;stats={domBlocks:meetings.length,parsedMeetings:meetings.length,validatedMeetings:validated,invalidWeekdays:0,periodFailures:0,weekFailures:0,missingTitles:0,inheritedTitles:parsed.diagnostics.inheritedTitles,adjustedBlocks:parsed.diagnostics.adjustedBlocks,adapterId:parsed.diagnostics.adapterId,adapterVersion:parsed.diagnostics.adapterVersion,profileVersion:parsed.diagnostics.profileVersion};if(validated!==meetings.length)throw Error("VALIDATION_FAILED");const semesterResult=adapter.extractSemester(capture,profile),semester={academicYear:semesterResult.academicYear,term:semesterResult.termCode,raw:[semesterResult.sourceCodes.xnm,semesterResult.sourceCodes.xqm].filter(Boolean).join("/")};const persisted=stableMeetings(meetings);pending={schemaVersion:1,key:`gupt::${semester.academicYear}::${semester.term}`,school:{id:"gupt",name:profile.name,sourceSystem:adapter.id},semester,meetings:persisted,importedAt:null,source:adapter.id,fingerprint:await fingerprint(semester,persisted),diagnostics:{inheritedTitles:stats.inheritedTitles,adapterId:adapter.id,adapterVersion:adapter.version,profileVersion:profile.profileVersion}};reply={window:event.source,nonce:p.nonce};count=meetings.length;status="PASS";renderPreview(pending)}catch(e){setMessage(friendlyImportError(e),"error")}event.source.postMessage({protocol:PROTOCOL,type:"ACK",nonce:p.nonce,status,meetingCount:count,stats},SOURCE_ORIGIN)});
const random=new Uint32Array(4);crypto.getRandomValues(random);const nonce=[...random].map(x=>x.toString(16).padStart(8,"0")).join("");if(window.parent!==window)window.parent.postMessage({protocol:PROTOCOL,type:"READY",nonce},SOURCE_ORIGIN);
save.addEventListener("click",async()=>{if(!pending)return;save.disabled=true;try{const factory=await persistenceFactory(),old=await getDataset(pending.key,factory);if(old?.fingerprint===pending.fingerprint){setMessage("课表没有变化","ok");return}const data={...pending,importedAt:new Date().toISOString()};await putDataset(data,factory);pending=data;dispatchEvent(new CustomEvent("anyclass:timetable-updated",{detail:{source:"bookmarklet"}}));setMessage(`${old?"课表已更新":"课表已保存到此设备"}\n${data.meetings.length} 个课程安排`,"ok")}catch(e){setMessage(e?.name==="NotAllowedError"?"保存需要允许此页面访问 AnyClass 的本机课表存储":"保存失败，原有课表未被修改","error");if(window.AnyClassShell){AnyClassShell.setImportError(false);AnyClassShell.setStorageError("无法写入本机课程数据。")}}finally{save.disabled=false}});
$("cancel").addEventListener("click",()=>showInitial(true));
$("reselectImport").addEventListener("click",()=>showInitial(false));
$("chooseComputer").addEventListener("click",()=>{if(pending){renderPreview(pending);return}const show=computer.hidden;computer.hidden=!show;$("chooseComputer").setAttribute("aria-expanded",String(show));if(show)computer.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})});
$("copyBookmarklet").addEventListener("click",async()=>{const status=$("copyBookmarkletStatus");try{const response=await fetch("/assets/timetable/bookmarklet.txt",{credentials:"same-origin"});if(!response.ok)throw Error("ASSET_UNAVAILABLE");const text=(await response.text()).trim();if(!text.startsWith("javascript:"))throw Error("INVALID_BOOKMARKLET");await copyText(text);status.textContent="✓ 已复制";status.className="ok import-copy-status";status.hidden=false}catch(_error){status.textContent="复制失败，请重试。";status.className="error import-copy-status";status.hidden=false}});
})();
</script>
</body></html>
