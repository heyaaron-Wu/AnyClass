# LOCAL REVIEW PROPOSAL ONLY. Never applied by this preview.
# Replace only the existing exact installation location after future approval.
# The only security-policy expansion is img-src 'self'. No data:, inline,
# external images, scripts, connect-src, redirects, preflight or other routes.
location = /shortcuts/install {
    try_files /shortcuts/install/index.html =404;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
}
