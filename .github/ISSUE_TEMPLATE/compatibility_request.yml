name: Academic-system compatibility request
description: Request or help validate support for another academic system
title: "[Compatibility] "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        **Never submit school account passwords, Cookies, Sessions, authentication tokens, student numbers, private timetable data, or private school-specific integration details.**

        Sanitized technical evidence is preferred. Compatibility status is based on evidence, not on school name alone.
  - type: input
    id: system
    attributes:
      label: Academic system
      placeholder: System family/name, for example ZhengFang V9
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: If known
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized technical evidence
      description: DOM structure, sanitized HTML fixture, selectors, screenshots, or other non-sensitive evidence.
  - type: dropdown
    id: test
    attributes:
      label: Can you test an adapter in a real environment?
      options:
        - "Yes"
        - "No"
        - "Maybe"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have removed credentials, personal data, and private school-specific material from the evidence I am submitting.
          required: true
