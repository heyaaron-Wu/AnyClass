name: Sync v0.1.1 import UI nav from verified production

on:
  push:
    branches:
      - sync-v0.1.1-import-ui-nav-production

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-v0.1.1-import-ui-nav-production
          fetch-depth: 0

      - name: Fetch exact verified production files
        shell: bash
        run: |
          set -euo pipefail
          fetch_verify() {
            url="$1"
            dest="$2"
            expected="$3"
            mkdir -p "$(dirname "$dest")"
            curl -fsSL --retry 3 --retry-delay 1 "$url" -o "$dest"
            actual="$(sha256sum "$dest" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "HASH_MISMATCH $dest expected=$expected actual=$actual"
              exit 1
            fi
            echo "MATCH $dest $actual"
          }

          base="https://anyclass.heyaaron.asia"
          fetch_verify "$base/about/" app/about/index.html eaf3c2155854a259b019782179d9659c7b0045e569af1b663c749cf42d06bdfd
          fetch_verify "$base/assets/timetable/product-shell.css" app/assets/timetable/product-shell.css 56b96e7e271335c6b68d76d0997dbadc9090d963ffb2d5476b1fc62a1193af40
          fetch_verify "$base/assets/timetable/product-shell.js" app/assets/timetable/product-shell.js 8f25a95686ee4a6fe55a1484e91906e105e03fd6a3649371b087cb45b649e827
          fetch_verify "$base/compatibility/" app/compatibility/index.html 5c955c998d064948dd30f6116841b40b91075eb1d05df3044603966b53448be9
          fetch_verify "$base/export/" app/export/index.html 6414f1716cbf2b0a1f526d30934bf189f3ce9bf0bd79abff53ddba3e1c21300f
          fetch_verify "$base/import-file/" app/import-file/index.html c981bd665e66b8396881b4872f9e8c8da8e5555cfd63cf013494d8500b180c18
          fetch_verify "$base/import-mobile/" app/import-mobile/index.html 693abf11a32d17d13f5da564842f8407e36b28cb30a14469f184fe0bfb4f8e71
          fetch_verify "$base/import/" app/import/index.html ad5d251495658e6a5d9063bcd1eb518010747f2b809734651c9c3f053c797afa
          fetch_verify "$base/" app/index.html b0744ed5f110df6cfd9d9de3b07a1f4c6ead0224768ed69dcf87b691cbe8d24b
          fetch_verify "$base/local-status/" app/local-status/index.html faf64628861213f5d0d683c9d7ebae982fc9af9e6316fad60e0b45529d4c400b
          fetch_verify "$base/settings/" app/settings/index.html 763337da623dc12a184ee5886dd9028602789f198cdcc5f5b9161ffac4478509
          fetch_verify "$base/settings/personalization/" app/settings/personalization/index.html cbc9029e63a4876236b3d83b7549dcaa5ea77ba7fd01bd29dfde0fa1772f321c
          fetch_verify "$base/settings/timetable/" app/settings/timetable/index.html af166b8c53d282ffb7b131e17fcb1f09e7e8d262df1c04bd20008cf99486ed39
          fetch_verify "$base/timetable/" app/timetable/index.html f335cd9959f8aa60094e19e7b139a4995417c2be492f0b2f776b8a5468c7e8e1
          fetch_verify "$base/today/" app/today/index.html b0744ed5f110df6cfd9d9de3b07a1f4c6ead0224768ed69dcf87b691cbe8d24b

      - name: Verify public contract
        shell: bash
        run: |
          set -euo pipefail
          echo "d3447a7bb50bd178d31990359b63d37d5cb7d5ea0c3c3056582fdfecbb7d164a  tests/public-contract.test.js" | sha256sum -c -
          node tests/public-contract.test.js

      - name: Commit verified files only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-v0.1.1-import-ui-nav-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "Changed paths relative to current branch head:"
          git diff --cached --name-only
          git commit -m "fix: sync import UI and navigation cleanup for v0.1.1"
          git push origin HEAD:sync-v0.1.1-import-ui-nav-production
