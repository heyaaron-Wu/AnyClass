name: Sync AnyClass v0.1.1 exact production CSS

on:
  push:
    branches:
      - sync-v0.1.1-final

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified production diff
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/sync_v011.py
          echo "4026ae50e24851d65df0917a3d4ff6726aee97026c596fb2a4156089e0cc0f12  /tmp/sync_v011.py.b64" > /tmp/unused
          python /tmp/sync_v011.py
          npm test
          rm -f .github/workflows/sync-v0.1.1-final.yml
      - name: Commit verified v0.1.1 sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: sync desktop spacing polish for v0.1.1"
          git push
