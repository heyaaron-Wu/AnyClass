name: Materialize public source v0.1.0

on:
  push:
    branches:
      - public-source-v0.1.0

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify audited source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path(".release-staging")
          expected = {
              "part-026": (8998, "c407156fc355532409c84840cc03386e5b4936d900e14c2f293051646d6f0ff2"),
              "part-027": (8998, "269496c43e27494950cefdbfffa5730ab76829e28b68be62e92a89651a282200"),
          }

          def clean_bytes(path):
              return path.read_bytes().replace(b"\r", b"").replace(b"\n", b"")

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def repair(name, data):
              if name not in expected:
                  return data
              target_len, target_sha = expected[name]
              if len(data) == target_len and sha256(data) == target_sha:
                  return data
              extra = len(data) - target_len
              if extra < 0:
                  raise SystemExit(f"{name}: too short ({len(data)} < {target_len})")
              for i in range(target_len + 1):
                  candidate = data[:i] + data[i + extra:]
                  if len(candidate) == target_len and sha256(candidate) == target_sha:
                      print(f"{name}: repaired by removing {extra} inserted byte(s) at offset {i}")
                      return candidate
              raise SystemExit(f"{name}: cannot repair to audited hash")

          parts = []
          for path in sorted(root.glob("part-*")):
              data = clean_bytes(path)
              data = repair(path.name, data)
              parts.append(data)

          merged = b"".join(parts)
          if len(merged) != 182184:
              raise SystemExit(f"unexpected base64 length: {len(merged)}")
          digest = sha256(merged)
          expected_digest = "a7c8b6ef6772450e39a14d886485d8664a1d1ec582ed45857c4e3b8d09493875"
          if digest != expected_digest:
              raise SystemExit(f"base64 hash mismatch: {digest}")
          Path("/tmp/anyclass-public.b64").write_bytes(merged)
          print("base64 bundle: VERIFIED")
          PY

          base64 -d /tmp/anyclass-public.b64 > /tmp/anyclass-public.tar.gz
          echo "a9c85c05c1d1139bbc5f479dbef71e9d973b8ce3528724a87719aa3d19b493e1  /tmp/anyclass-public.tar.gz" | sha256sum -c -
          tar -xzf /tmp/anyclass-public.tar.gz -C .
          npm test
          rm -rf .release-staging
          rm -f .github/workflows/public-source-materialize.yml

      - name: Commit materialized public source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: publish AnyClass v0.1.0 source"
          git push
