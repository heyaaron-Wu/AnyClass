name: Sync v0.1.1 import UI nav cleanup

on:
  push:
    branches:
      - sync-v0.1.1-import-ui-nav-cleanup

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-v0.1.1-import-ui-nav-cleanup
          fetch-depth: 0
      - name: Rebuild and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/sync-payload/part* > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/sync.tar.gz
          echo "30cb3450b7268cb58ad5f8361dc0134f3759fb76c9b68783624ac4ec2ac214b0  /tmp/sync.tar.gz" | sha256sum -c -
          rm -rf /tmp/sync
          mkdir -p /tmp/sync
          tar -xzf /tmp/sync.tar.gz -C /tmp/sync
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path("/tmp/sync")
          manifest=json.loads((root/"SYNC_MANIFEST.json").read_text(encoding="utf-8"))
          assert manifest["classification"]=="ANYCLASS_IMPORT_UI_NAV_CLEANUP_GITHUB_SYNC_ARTIFACT_READY"
          assert manifest["targetVersion"]=="0.1.1"
          assert len(manifest["files"])==16
          for item in manifest["files"]:
              p=root/item["path"]
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual==item["sha256"], (item["path"], actual, item["sha256"])
          print("MANIFEST=PASS")
          PY
      - name: Apply repository files
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/sync/app/. app/
          cp /tmp/sync/tests/public-contract.test.js tests/public-contract.test.js
          node tests/public-contract.test.js
      - name: Remove staging files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/sync-payload
          rm -f .github/workflows/sync-v0.1.1-import-ui-nav-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix: sync import UI and navigation cleanup for v0.1.1"
          git push origin HEAD:sync-v0.1.1-import-ui-nav-cleanup
