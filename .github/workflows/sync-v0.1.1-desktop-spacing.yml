name: Sync AnyClass v0.1.1 desktop spacing

on:
  push:
    branches:
      - sync-v0.1.1-desktop-spacing

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact production spacing polish
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/sync_v011.py
          python /tmp/sync_v011.py
          sha256sum app/assets/timetable/product-shell.css
          npm test
          rm -rf .sync-staging .sync-staging2
          rm -f .github/workflows/sync-v0.1.1-desktop-spacing.yml
      - name: Commit verified v0.1.1 sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: sync desktop spacing polish for v0.1.1"
          git push
